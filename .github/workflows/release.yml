name: release

# Builds the orc packages for Windows, macOS, and Linux around the pinned
# Gecko engine recorded in installers/engine-manifest.json. Every engine
# artifact is verified against both the manifest SHA-256 and its publisher
# sidecar before anything is staged.
#
# - Run manually (workflow_dispatch) to produce downloadable artifacts.
# - Push a v* tag to also cut a GitHub Release with SHA256SUMS.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "orc version (no leading v)"
        required: false
        default: "0.1.0"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      engine_version: ${{ steps.meta.outputs.engine_version }}
      engine_source: ${{ steps.meta.outputs.engine_source }}
      windows_x86_64_file: ${{ steps.meta.outputs.windows_x86_64_file }}
      windows_x86_64_sha: ${{ steps.meta.outputs.windows_x86_64_sha }}
      windows_arm64_file: ${{ steps.meta.outputs.windows_arm64_file }}
      windows_arm64_sha: ${{ steps.meta.outputs.windows_arm64_sha }}
      macos_arm64_file: ${{ steps.meta.outputs.macos_arm64_file }}
      macos_arm64_sha: ${{ steps.meta.outputs.macos_arm64_sha }}
      macos_x86_64_file: ${{ steps.meta.outputs.macos_x86_64_file }}
      macos_x86_64_sha: ${{ steps.meta.outputs.macos_x86_64_sha }}
      linux_x86_64_file: ${{ steps.meta.outputs.linux_x86_64_file }}
      linux_x86_64_sha: ${{ steps.meta.outputs.linux_x86_64_sha }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION:-0.1.0}"
          fi
          MAN=installers/engine-manifest.json
          ENGINE_VERSION="$(jq -r .engineVersion "$MAN")"
          UPSTREAM="$(jq -r '.upstreamIdParts | join("")' "$MAN")"
          SOURCE="$(jq -r .sourceTemplate "$MAN")"
          SOURCE="${SOURCE//\{upstream\}/$UPSTREAM}"
          SOURCE="${SOURCE//\{version\}/$ENGINE_VERSION}"
          {
            echo "version=$VERSION"
            echo "engine_version=$ENGINE_VERSION"
            echo "engine_source=$SOURCE"
            for k in windows-x86_64 windows-arm64 macos-arm64 macos-x86_64 linux-x86_64; do
              TEMPLATE="$(jq -r ".artifacts.\"$k\".fileTemplate" "$MAN")"
              FILE="${TEMPLATE//\{upstream\}/$UPSTREAM}"
              FILE="${FILE//\{version\}/$ENGINE_VERSION}"
              echo "${k//-/_}_file=$FILE"
              echo "${k//-/_}_sha=$(jq -r ".artifacts.\"$k\".sha256" "$MAN")"
            done
          } >> "$GITHUB_OUTPUT"

  windows:
    needs: meta
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch == 'arm64' && 'amd64_arm64' || 'x64' }}
      - name: Build launcher
        shell: pwsh
        run: ./packaging/build-launcher.ps1 -Out build/orc.exe -Icon branding/orc.ico
      - name: Download and verify Tractor search service
        shell: pwsh
        run: |
          $manifest = Get-Content installers\tractor-manifest.json -Raw | ConvertFrom-Json
          $artifact = $manifest.artifacts.'windows-x86_64'
          $base = $manifest.sourceTemplate.Replace('{version}', $manifest.version)
          $archive = Join-Path $PWD 'build\tractor.zip'
          New-Item -ItemType Directory -Force (Split-Path $archive) | Out-Null
          Invoke-WebRequest -Uri "$base$($artifact.file)" -OutFile $archive
          Invoke-WebRequest -Uri "$base$($manifest.checksumFile)" -OutFile "$archive.sums"
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          $entry = Get-Content "$archive.sums" | Where-Object { ($_ -split '\s+', 2)[1] -eq $artifact.file } | Select-Object -First 1
          if (-not $entry) { throw 'Tractor archive is missing from SHA256SUMS.txt' }
          $sidecar = ($entry -split '\s+', 2)[0].ToLowerInvariant()
          if ($actual -ne $artifact.sha256 -or $actual -ne $sidecar) { throw "Tractor SHA-256 mismatch: got $actual" }
      - name: Stage package (downloads + verifies the engine itself)
        shell: pwsh
        run: >
          ./packaging/stage-windows.ps1
          -Arch ${{ matrix.arch }}
          -Version ${{ needs.meta.outputs.version }}
          -OrcExe build/orc.exe
          -OutDir dist
          -TractorZip build\tractor.zip
      - name: Build NSIS installer
        shell: pwsh
        run: |
          $makensis = (Get-Command makensis.exe -ErrorAction SilentlyContinue).Source
          if (-not $makensis) {
            choco install nsis -y --no-progress | Out-Host
            # Chocolatey deploys NSIS under Program Files (x86), not
            # Program Files - probe both, then PATH (CI run #2).
            foreach ($cand in @("$env:ProgramFiles\NSIS\makensis.exe",
                                 "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
              if (Test-Path $cand) { $makensis = $cand; break }
            }
            if (-not $makensis) { $makensis = (Get-Command makensis.exe -ErrorAction Stop).Source }
          }
          $stage = Join-Path $PWD "dist\stage-windows-${{ matrix.arch }}\orc"
          $out = Join-Path $PWD "dist\orc-${{ needs.meta.outputs.version }}-windows-${{ matrix.arch }}-setup.exe"
          & $makensis /DSTAGE=$stage /DVERSION=${{ needs.meta.outputs.version }} /DARCH=${{ matrix.arch }} /DOUTFILE=$out installers\nsis\orc.nsi
          if ($LASTEXITCODE -ne 0) { throw 'makensis failed' }
          $hash = (Get-FileHash -Algorithm SHA256 $out).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $out)" | Set-Content "$out.sha256sum" -Encoding ascii
      - name: Smoke test the package (x86_64 only - arm64 is cross-built)
        if: matrix.arch == 'x86_64'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $zip = Get-ChildItem dist\orc-*-windows-x86_64.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath smoke -Force
          $exe = Join-Path $PWD "smoke\orc\orc.exe"
          if (-not (Test-Path $exe)) { throw "orc.exe missing from the package" }
          $shot = Join-Path $PWD "smoke.png"
          $proc = Start-Process $exe -ArgumentList '--headless','--screenshot',"$shot",'--window-size=1280,800','https://nosuchmachine.net/' -Wait -PassThru -NoNewWindow -RedirectStandardError smoke-err.txt -RedirectStandardOutput smoke-out.txt
          Write-Host "launcher exit code: $($proc.ExitCode)"
          if (Test-Path smoke-err.txt) { Get-Content smoke-err.txt | Write-Host }
          for ($i = 0; $i -lt 30 -and -not (Test-Path $shot); $i++) { Start-Sleep -Seconds 2 }
          if (-not (Test-Path $shot)) { throw "no screenshot produced" }
          if ((Get-Item $shot).Length -lt 20000) { throw "screenshot suspiciously small" }
          Write-Host "smoke ok: $((Get-Item $shot).Length) bytes"
      - uses: actions/upload-artifact@v4
        with:
          name: orc-windows-${{ matrix.arch }}
          path: |
            dist/orc-*-windows-${{ matrix.arch }}.zip
            dist/orc-*-windows-${{ matrix.arch }}-setup.exe
            dist/*.sha256sum
          if-no-files-found: error

  macos:
    needs: meta
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            file_key: macos_arm64
          - arch: x86_64
            file_key: macos_x86_64
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x packaging/*.sh
      - name: Download + verify engine
        shell: bash
        run: |
          set -euo pipefail
          FILE="${{ needs.meta.outputs[format('{0}_file', matrix.file_key)] }}"
          SHA="${{ needs.meta.outputs[format('{0}_sha', matrix.file_key)] }}"
          BASE="${{ needs.meta.outputs.engine_source }}"
          curl -fL "$BASE$FILE" -o engine.dmg
          curl -fL "$BASE$FILE.sha256sum" -o engine.dmg.sha256sum
          ACTUAL="$(shasum -a 256 engine.dmg | awk '{print $1}')"
          SIDECAR="$(awk '{print $1}' engine.dmg.sha256sum)"
          [ "$ACTUAL" = "$SHA" ] || { echo "sha256 mismatch vs manifest"; exit 1; }
          [ "$ACTUAL" = "$SIDECAR" ] || { echo "sha256 mismatch vs sidecar"; exit 1; }
          echo "verified $FILE $ACTUAL"
      - name: Download + verify Tractor search service
        shell: bash
        run: |
          set -euo pipefail
          MAN=installers/tractor-manifest.json
          VERSION=$(jq -r .version "$MAN")
          KEY="macos-${{ matrix.arch }}"
          FILE=$(jq -r ".artifacts[\"$KEY\"].file" "$MAN")
          PIN=$(jq -r ".artifacts[\"$KEY\"].sha256" "$MAN")
          BASE=$(jq -r .sourceTemplate "$MAN")
          BASE="${BASE//\{version\}/$VERSION}"
          curl -fL "$BASE$FILE" -o build-tractor.tar.gz
          curl -fL "$BASE$(jq -r .checksumFile "$MAN")" -o build-tractor.sums
          ACTUAL=$(shasum -a 256 build-tractor.tar.gz | awk '{print $1}')
          SIDECAR=$(awk -v file="$FILE" '$2 == file {print $1}' build-tractor.sums)
          [ "$ACTUAL" = "$PIN" ] && [ "$ACTUAL" = "$SIDECAR" ]
      - name: Build icon + launcher
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build dist
          iconutil -c icns branding/orc.iconset -o dist/orc.icns
          ./packaging/build-launcher.sh macos build/orc ${{ matrix.arch }}
      - name: Stage package
        shell: bash
        run: |
          set -euo pipefail
          ORC_ICNS=dist/orc.icns ./packaging/stage-macos.sh \
            engine.dmg build-tractor.tar.gz ${{ matrix.arch }} ${{ needs.meta.outputs.version }} build/orc dist
      - name: Smoke test the package
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          APP="dist/stage-macos-${{ matrix.arch }}/orc.app"
          codesign --verify --deep --strict "$APP"
          "$APP/Contents/MacOS/orc" --headless --screenshot "$PWD/smoke.png" --window-size=1280,800 https://nosuchmachine.net/
          [ -f smoke.png ] && [ "$(stat -f%z smoke.png)" -gt 20000 ] || { echo "smoke screenshot missing or tiny"; exit 1; }
          echo "smoke ok"
      - name: Diagnose the macOS engine (only when the smoke failed)
        if: failure()
        shell: bash
        run: |
          APP="dist/stage-macos-${{ matrix.arch }}/orc.app"
          ENG="$APP/Contents/Resources/engine/orc.app"
          ls -la "$ENG/Contents/MacOS/" || true
          file "$ENG/Contents/MacOS/orc" || true
          codesign --verify --deep --strict --verbose=4 "$ENG" || true
          "$ENG/Contents/MacOS/orc" -profile "$PWD/diag-profile" --headless --screenshot "$PWD/direct.png" --window-size=800,600 about:blank || true
          ls -la direct.png 2>/dev/null || echo "direct engine run produced no screenshot"
      - uses: actions/upload-artifact@v4
        with:
          name: orc-macos-${{ matrix.arch }}
          path: |
            dist/orc-*-macos-${{ matrix.arch }}.zip
            dist/orc-*-macos-${{ matrix.arch }}.zip.sha256sum
          if-no-files-found: error

  linux:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x packaging/*.sh
      - name: Download + verify engine
        shell: bash
        run: |
          set -euo pipefail
          FILE="${{ needs.meta.outputs.linux_x86_64_file }}"
          SHA="${{ needs.meta.outputs.linux_x86_64_sha }}"
          BASE="${{ needs.meta.outputs.engine_source }}"
          curl -fL "$BASE$FILE" -o engine.tar.xz
          curl -fL "$BASE$FILE.sha256sum" -o engine.tar.xz.sha256sum
          ACTUAL="$(sha256sum engine.tar.xz | awk '{print $1}')"
          SIDECAR="$(awk '{print $1}' engine.tar.xz.sha256sum)"
          [ "$ACTUAL" = "$SHA" ] || { echo "sha256 mismatch vs manifest"; exit 1; }
          [ "$ACTUAL" = "$SIDECAR" ] || { echo "sha256 mismatch vs sidecar"; exit 1; }
          echo "verified $FILE $ACTUAL"
      - name: Download + verify Tractor search service
        shell: bash
        run: |
          set -euo pipefail
          MAN=installers/tractor-manifest.json
          VERSION=$(jq -r .version "$MAN")
          FILE=$(jq -r '.artifacts["linux-x86_64"].file' "$MAN")
          PIN=$(jq -r '.artifacts["linux-x86_64"].sha256' "$MAN")
          BASE=$(jq -r .sourceTemplate "$MAN")
          BASE="${BASE//\{version\}/$VERSION}"
          curl -fL "$BASE$FILE" -o tractor.tar.gz
          curl -fL "$BASE$(jq -r .checksumFile "$MAN")" -o tractor.sums
          ACTUAL=$(sha256sum tractor.tar.gz | awk '{print $1}')
          SIDECAR=$(awk -v file="$FILE" '$2 == file {print $1}' tractor.sums)
          [ "$ACTUAL" = "$PIN" ] && [ "$ACTUAL" = "$SIDECAR" ]
      - name: Build launcher + stage package
        shell: bash
        run: |
          set -euo pipefail
          ./packaging/build-launcher.sh linux build/orc
          ./packaging/stage-linux.sh engine.tar.xz tractor.tar.gz "${{ needs.meta.outputs.version }}" build/orc dist
      - name: Smoke test the package
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p smoke && tar -xzf dist/orc-*-linux-x86_64.tar.gz -C smoke
          ./smoke/orc/orc --headless --screenshot "$PWD/smoke.png" --window-size=1280,800 https://nosuchmachine.net/
          [ -f smoke.png ] && [ "$(stat -c%s smoke.png)" -gt 20000 ] || { echo "smoke screenshot missing or tiny"; exit 1; }
          python3 tests/browser_recursion.py "$PWD/smoke/orc/orc"
          echo "smoke ok"
      - uses: actions/upload-artifact@v4
        with:
          name: orc-linux-x86_64
          path: |
            dist/orc-*-linux-x86_64.tar.gz
            dist/orc-*-linux-x86_64.tar.gz.sha256sum
          if-no-files-found: error

  release:
    needs: [meta, windows, macos, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          # This job never checks out the repo (artifacts only), so gh
          # has no git remote to infer from and dies with "failed to
          # run git: not a git repository" (release run #4). Name the
          # repo outright.
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          cat -- *.sha256sum > SHA256SUMS.txt
          VERSION="${{ needs.meta.outputs.version }}"
          cat > notes.md <<EOF
          orc $VERSION

          A pinned Gecko ${{ needs.meta.outputs.engine_version }} engine
          (MPL-2.0), orc's native launcher, policies, profile seed, recursive
          workspaces, and canonical icon.

          Packages are UNSIGNED for now: Windows SmartScreen and macOS
          Gatekeeper will warn - see the repo README for the honest
          install steps. Verify downloads against SHA256SUMS.txt.

          Install orc, open it: nosuchmachine.net, Blacksite included,
          on the same engine everywhere.
          EOF
          # The tag may arrive with a release already attached (the
          # web UI creates both together); either way the assets land.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" --clobber *.zip *.tar.gz *-setup.exe SHA256SUMS.txt
            gh release edit "${GITHUB_REF_NAME}" --title "orc $VERSION" --notes-file notes.md
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "orc $VERSION" \
              --notes-file notes.md \
              *.zip *.tar.gz *-setup.exe SHA256SUMS.txt
          fi
