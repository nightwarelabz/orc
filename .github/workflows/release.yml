name: release

# Builds the orc wraparound packages for Windows, macOS and Linux
# around the pinned, unmodified LibreWolf engine recorded in
# installers/engine-manifest.json. Every engine artifact is verified
# twice (manifest sha256 AND the official dl.librewolf.net sidecar)
# before anything is staged.
#
# - Run manually (workflow_dispatch) to produce downloadable artifacts.
# - Push a v* tag to also cut a GitHub Release with SHA256SUMS.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "orc version (no leading v)"
        required: false
        default: "0.1.0"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      engine_version: ${{ steps.meta.outputs.engine_version }}
      windows_x86_64_file: ${{ steps.meta.outputs.windows_x86_64_file }}
      windows_x86_64_sha: ${{ steps.meta.outputs.windows_x86_64_sha }}
      windows_arm64_file: ${{ steps.meta.outputs.windows_arm64_file }}
      windows_arm64_sha: ${{ steps.meta.outputs.windows_arm64_sha }}
      macos_arm64_file: ${{ steps.meta.outputs.macos_arm64_file }}
      macos_arm64_sha: ${{ steps.meta.outputs.macos_arm64_sha }}
      macos_x86_64_file: ${{ steps.meta.outputs.macos_x86_64_file }}
      macos_x86_64_sha: ${{ steps.meta.outputs.macos_x86_64_sha }}
      linux_x86_64_file: ${{ steps.meta.outputs.linux_x86_64_file }}
      linux_x86_64_sha: ${{ steps.meta.outputs.linux_x86_64_sha }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION:-0.1.0}"
          fi
          MAN=installers/engine-manifest.json
          {
            echo "version=$VERSION"
            echo "engine_version=$(jq -r .engineVersion "$MAN")"
            for k in windows-x86_64 windows-arm64 macos-arm64 macos-x86_64 linux-x86_64; do
              echo "${k//-/_}_file=$(jq -r ".artifacts.\"$k\".file" "$MAN")"
              echo "${k//-/_}_sha=$(jq -r ".artifacts.\"$k\".sha256" "$MAN")"
            done
          } >> "$GITHUB_OUTPUT"

  windows:
    needs: meta
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch == 'arm64' && 'arm64' || 'x64' }}
      - name: Build launcher
        shell: pwsh
        run: ./packaging/build-launcher.ps1 -Out build/orc.exe -Icon branding/orc.ico
      - name: Stage package (downloads + verifies the engine itself)
        shell: pwsh
        run: >
          ./packaging/stage-windows.ps1
          -Arch ${{ matrix.arch }}
          -Version ${{ needs.meta.outputs.version }}
          -OrcExe build/orc.exe
          -OutDir dist
      - name: Build NSIS installer
        shell: pwsh
        run: |
          $makensis = (Get-Command makensis.exe -ErrorAction SilentlyContinue).Source
          if (-not $makensis) {
            choco install nsis -y --no-progress | Out-Host
            $makensis = "$env:ProgramFiles\NSIS\makensis.exe"
          }
          $stage = Join-Path $PWD "dist\stage-windows-${{ matrix.arch }}\orc"
          $out = Join-Path $PWD "dist\orc-${{ needs.meta.outputs.version }}-windows-${{ matrix.arch }}-setup.exe"
          & $makensis /DSTAGE=$stage /DVERSION=${{ needs.meta.outputs.version }} /DARCH=${{ matrix.arch }} /DOUTFILE=$out installers\nsis\orc.nsi
          if ($LASTEXITCODE -ne 0) { throw 'makensis failed' }
          $hash = (Get-FileHash -Algorithm SHA256 $out).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $out)" | Set-Content "$out.sha256sum" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: orc-windows-${{ matrix.arch }}
          path: |
            dist/orc-*-windows-${{ matrix.arch }}.zip
            dist/orc-*-windows-${{ matrix.arch }}-setup.exe
            dist/*.sha256sum
          if-no-files-found: error

  macos:
    needs: meta
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            file_key: macos_arm64
          - arch: x86_64
            file_key: macos_x86_64
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x packaging/*.sh
      - name: Download + verify engine
        shell: bash
        run: |
          set -euo pipefail
          FILE="${{ needs.meta.outputs[format('{0}_file', matrix.file_key)] }}"
          SHA="${{ needs.meta.outputs[format('{0}_sha', matrix.file_key)] }}"
          BASE="https://dl.librewolf.net/librewolf/${{ needs.meta.outputs.engine_version }}"
          curl -fL "$BASE/$FILE" -o engine.dmg
          curl -fL "$BASE/$FILE.sha256sum" -o engine.dmg.sha256sum
          ACTUAL="$(shasum -a 256 engine.dmg | awk '{print $1}')"
          SIDECAR="$(awk '{print $1}' engine.dmg.sha256sum)"
          [ "$ACTUAL" = "$SHA" ] || { echo "sha256 mismatch vs manifest"; exit 1; }
          [ "$ACTUAL" = "$SIDECAR" ] || { echo "sha256 mismatch vs sidecar"; exit 1; }
          echo "verified $FILE $ACTUAL"
      - name: Build icon + launcher
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build dist
          iconutil -c icns branding/orc.iconset -o dist/orc.icns
          ./packaging/build-launcher.sh macos build/orc ${{ matrix.arch }}
      - name: Stage package
        shell: bash
        run: |
          set -euo pipefail
          ORC_ICNS=dist/orc.icns ./packaging/stage-macos.sh \
            engine.dmg ${{ matrix.arch }} ${{ needs.meta.outputs.version }} build/orc dist
      - uses: actions/upload-artifact@v4
        with:
          name: orc-macos-${{ matrix.arch }}
          path: |
            dist/orc-*-macos-${{ matrix.arch }}.zip
            dist/orc-*-macos-${{ matrix.arch }}.zip.sha256sum
          if-no-files-found: error

  linux:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x packaging/*.sh
      - name: Download + verify engine
        shell: bash
        run: |
          set -euo pipefail
          FILE="${{ needs.meta.outputs.linux_x86_64_file }}"
          SHA="${{ needs.meta.outputs.linux_x86_64_sha }}"
          BASE="https://dl.librewolf.net/librewolf/${{ needs.meta.outputs.engine_version }}"
          curl -fL "$BASE/$FILE" -o engine.tar.xz
          curl -fL "$BASE/$FILE.sha256sum" -o engine.tar.xz.sha256sum
          ACTUAL="$(sha256sum engine.tar.xz | awk '{print $1}')"
          SIDECAR="$(awk '{print $1}' engine.tar.xz.sha256sum)"
          [ "$ACTUAL" = "$SHA" ] || { echo "sha256 mismatch vs manifest"; exit 1; }
          [ "$ACTUAL" = "$SIDECAR" ] || { echo "sha256 mismatch vs sidecar"; exit 1; }
          echo "verified $FILE $ACTUAL"
      - name: Build launcher + stage package
        shell: bash
        run: |
          set -euo pipefail
          ./packaging/build-launcher.sh linux build/orc
          ./packaging/stage-linux.sh engine.tar.xz "${{ needs.meta.outputs.version }}" build/orc dist
      - uses: actions/upload-artifact@v4
        with:
          name: orc-linux-x86_64
          path: |
            dist/orc-*-linux-x86_64.tar.gz
            dist/orc-*-linux-x86_64.tar.gz.sha256sum
          if-no-files-found: error

  release:
    needs: [meta, windows, macos, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          cat -- *.sha256sum > SHA256SUMS.txt
          VERSION="${{ needs.meta.outputs.version }}"
          cat > notes.md <<EOF
          orc $VERSION - ORC (Orchestration), the Nightware Labz browser.

          Wraparound build: a small native launcher + the unmodified
          LibreWolf ${{ needs.meta.outputs.engine_version }} engine
          (MPL-2.0), orc's policies, orc's profile seed, orc's face.

          Packages are UNSIGNED for now: Windows SmartScreen and macOS
          Gatekeeper will warn - see the repo README for the honest
          install steps. Verify downloads against SHA256SUMS.txt.

          Install orc, open it: nosuchmachine.net, Blacksite included,
          on the same engine everywhere.
          EOF
          gh release create "${GITHUB_REF_NAME}" \
            --title "orc $VERSION" \
            --notes-file notes.md \
            -- *.zip *.tar.gz *-setup.exe SHA256SUMS.txt
