// ---- orc autoconfig (appended to librewolf.cfg by orc's stagers) ----
// LibreWolf 158 gates every WebGL context behind a per-site permission
// prompt: librewolf.webgl.prompt defaults to true, context creation is
// blocked until the user grants the site permission from a small
// address-bar icon, and the grant is temporary -- so pages report
// "WebGL is not available" in a browser where webgl.disabled=false.
// orc is a full-functionality browser, so the prompt is off and WebGL
// is simply available, as in Firefox. pref() (not defaultPref) so the
// value is re-asserted at every startup and existing profiles heal;
// enterprise policy cannot carry a librewolf.* pref, which is why this
// rides the autoconfig instead of distribution/policies.json.
pref("librewolf.webgl.prompt", false);
