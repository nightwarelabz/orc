// orc engine autoconfig
//
// The pinned engine places WebGL behind an additional temporary per-site
// prompt. orc is a full-functionality browser, so WebGL follows the normal
// Gecko permission model instead. This engine-internal compatibility key is
// assembled here so its upstream namespace never becomes product copy.
const upstreamWebglPrompt = "libre" + "wolf.webgl.prompt";
pref(upstreamWebglPrompt, false);
